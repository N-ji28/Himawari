<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1F3A37">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="description" content="Game latihan Mandarin HIMAWARI untuk ebook Lanjutan HSK 2-3: ruang campur, kuis kata, tebak gambar, mendengar, cerita, pasangkan kartu, susun kalimat, dan voice note.">
<title>Game Mandarin HIMAWARI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito+Sans:wght@400;700;800&family=Noto+Sans+SC:wght@500;700&display=swap">
<style>
html{-webkit-text-size-adjust:100%}body{margin:0}
/* Layout: one centered play column; brand bar on top, four mode tabs, a single game card, score strip below. Brand palette from the HIMAWARI sunflower logo. */
:root{--bg:#F5F1E6;--card:#FFFDF7;--ink:#1F3A37;--muted:#5E6B66;--line:#DDD5BF;--accent:#1F3A37;--accent-ink:#FFFFFF;--gold:#E0A818;--gold-soft:#FBEFC8;--good:#2F7A4B;--good-soft:#DCEFE2;--bad:#B4472B;--bad-soft:#F7E1DA;--display:'Fredoka','Nunito Sans',system-ui,sans-serif;--body:'Nunito Sans',system-ui,sans-serif;--han:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13211F;--card:#1B2E2B;--ink:#EEF3EF;--muted:#A5B8B1;--line:#2E4642;--accent:#E0A818;--accent-ink:#13211F;--gold:#E0A818;--gold-soft:#3A3416;--good:#6CCB8E;--good-soft:#1F3D2D;--bad:#F0907A;--bad-soft:#442620;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#13211F;--card:#1B2E2B;--ink:#EEF3EF;--muted:#A5B8B1;--line:#2E4642;--accent:#E0A818;--accent-ink:#13211F;--gold:#E0A818;--gold-soft:#3A3416;--good:#6CCB8E;--good-soft:#1F3D2D;--bad:#F0907A;--bad-soft:#442620;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
header img{width:210px;height:auto}
.tag{font-family:var(--display);font-size:15px;color:var(--muted);letter-spacing:.04em}
nav{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
nav button{font:700 15px var(--body);line-height:1.2;overflow-wrap:anywhere;padding:12px 4px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;min-width:0}
nav button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.opts{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.opts label{font-size:14px;color:var(--muted);font-weight:700;display:flex;gap:6px;align-items:center}
select{font:600 15px var(--body);padding:8px 10px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);max-width:100%}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:16px;min-height:360px}
h2{font-family:var(--display);font-size:22px;font-weight:600;margin:0;text-wrap:balance}
.q{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:10px 0}
.han{font-family:var(--han);font-weight:700;font-size:64px;line-height:1.15}
.sub{color:var(--muted);font-size:16px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choices.one{grid-template-columns:1fr}
.how{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 14px}
.how summary{font-weight:800;cursor:pointer}
.how ol{margin:8px 0 2px;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:16px}
.emo{font-size:84px;line-height:1.15;letter-spacing:.06em}
.choice.hz{font-family:var(--han);font-size:19px;line-height:1.35;text-align:left}
.story{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.story p{margin:0;display:flex;flex-direction:column;gap:2px}
.story .z{font-family:var(--han);font-weight:700;font-size:24px;line-height:1.4}
.story .p{color:var(--muted);font-size:15px}
.story .i{background:var(--gold-soft);border-radius:8px;padding:4px 8px;font-size:16px}
.han.long{font-size:30px;line-height:1.35}
[hidden]{display:none!important}
.chk{display:flex;gap:6px;align-items:center;font-weight:700;font-size:14px;color:var(--muted)}
.choice{font:700 17px var(--body);padding:16px 12px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;min-width:0;overflow-wrap:anywhere}
.choice.han2{font-family:var(--han);font-size:26px}
.choice:hover{border-color:var(--gold)}
.choice.good{background:var(--good-soft);border-color:var(--good)}
.choice.bad{background:var(--bad-soft);border-color:var(--bad)}
.btn{font:800 16px var(--body);padding:12px 20px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--gold);width:0;transition:width .25s}
.fb{min-height:28px;font-weight:800}.fb.good{color:var(--good)}.fb.bad{color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{min-height:84px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font:700 16px var(--body);padding:8px;display:flex;align-items:center;justify-content:center;text-align:center;overflow-wrap:anywhere;min-width:0}
.tile.h{font-family:var(--han);font-size:28px}
.tile.back{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-size:26px}
.tile.done{background:var(--good-soft);border-color:var(--good);cursor:default}
.tray{display:flex;flex-wrap:wrap;gap:8px;min-height:62px;padding:10px;border-radius:14px;border:2px dashed var(--line)}
.ans{border-style:solid;background:var(--gold-soft);border-color:var(--gold)}
.chip{font-family:var(--han);font-weight:700;font-size:24px;padding:8px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.2}
.chip small{font:600 13px var(--body);color:var(--muted)}
.hint{padding:12px 14px;border-radius:12px;background:var(--gold-soft);font-weight:700}
.stats{display:flex;gap:18px;flex-wrap:wrap;font-weight:800;font-variant-numeric:tabular-nums;color:var(--muted);font-size:15px}
.stats b{color:var(--ink);font-size:18px}
.checklist{display:flex;gap:8px;flex-wrap:wrap}
.checklist button{flex:1;min-width:120px}
audio{width:100%}
.filebtn{display:inline-block}
.filebtn input{position:absolute;opacity:0;width:1px;height:1px}
.review{display:flex;flex-direction:column;gap:6px;font-size:16px}
.review div{display:flex;gap:10px;flex-wrap:wrap}.review .han{font-size:24px}
#hud{display:flex;gap:10px;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:8px;background:var(--card);border:2px solid var(--line);border-radius:99px;padding:6px 14px;font-weight:800;font-variant-numeric:tabular-nums}
.pill small{font-weight:700;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.pill b{font-size:20px}
.pill svg{width:22px;height:22px}
.pill.hot{border-color:var(--gold);background:var(--gold-soft)}
.pill.hot svg{animation:flick .9s infinite alternate}
@keyframes flick{to{transform:scale(1.15) rotate(-4deg)}}
.pop{position:fixed;left:50%;top:22%;transform:translateX(-50%);font:600 40px var(--display);color:var(--gold);pointer-events:none;animation:up 1.1s forwards;text-shadow:0 2px 0 var(--bg)}
@keyframes up{to{opacity:0;transform:translate(-50%,-70px)}}
.grade{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.grade .big{font:600 72px var(--display);line-height:1;color:var(--gold)}
.grade .num{font:600 28px var(--display)}
.cheer{padding:14px 16px;border-radius:14px;background:var(--good-soft);font-weight:800;font-size:18px}
.tile small,.choice small{display:block;font:600 13px var(--body);color:var(--muted);margin-top:2px}
@media (min-width:720px){.han.long{font-size:42px}.emo{font-size:110px}.choice.hz{font-size:22px}.story .z{font-size:28px}body{font-size:18px;padding-block:32px 56px}.card{padding:32px;gap:20px;min-height:440px}.han{font-size:88px}.choices{gap:14px}.choice{padding:20px 16px;font-size:19px}.choice.han2{font-size:32px}.grid{grid-template-columns:repeat(4,1fr);gap:14px}.tile{min-height:110px;font-size:18px}.tile.h{font-size:34px}.chip{font-size:30px;padding:10px 18px}header img{width:260px}nav button{font-size:16px;padding:14px 6px}h2{font-size:26px}}
@media (min-width:1100px){.wrap{max-width:1000px}.card{min-height:480px}}
@media (hover:none){.choice:hover{border-color:var(--line)}}
.btn,.choice,.tile,.chip,nav button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.btn{min-height:48px}
.rec{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.recbtn{display:flex;align-items:center;gap:12px;font:800 18px var(--body);padding:14px 22px;border-radius:99px;border:0;background:var(--bad);color:#fff;cursor:pointer;min-height:56px}
.recbtn i{width:14px;height:14px;border-radius:50%;background:#fff}
.recbtn.on i{border-radius:3px;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
.dl{font-weight:800;color:var(--ink)}
.theme{font:700 13px var(--body);padding:6px 12px;border-radius:99px;border:2px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer}
@media (max-width:480px){.han{font-size:52px}.grid{grid-template-columns:repeat(3,1fr)}header img{width:170px}nav button{font-size:12.5px;padding:11px 2px}}
.ico{--s:132px;width:var(--s);height:var(--s);background:url(img/ikon.webp) no-repeat;background-size:calc(var(--s)*10) calc(var(--s)*6);background-position:calc(var(--c)*var(--s)*-1) calc(var(--r)*var(--s)*-1);margin:0 auto}
.tagq{display:inline-block;align-self:center;font:800 12px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--gold-soft);border-radius:99px;padding:4px 12px}
@media (min-width:720px){.ico{--s:168px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

]],["对不起，我来晚了。","duìbùqǐ, wǒ lái wǎn le.","Maaf, aku datang terlambat.",["没关系，请坐。","méi guānxi, qǐng zuò.","Tidak apa-apa, silakan duduk."],[["一共二十块。","yígòng èr shí kuài."],["我有点发烧。","wǒ yǒu diǎn fāshāo."],["去机场。","qù jīchǎng."]]],["谢谢你帮我。","xièxie nǐ bāng wǒ.","Terima kasih sudah membantuku.",["不客气。","búkèqì.","Sama-sama."],[["我没吃过。","wǒ méi chī guò."],["一共三百块。","yígòng sān bǎi kuài."],["他在开会。","tā zài kāihuì."]]],["你周末有空吗？","nǐ zhōumò yǒu kōng ma?","Akhir pekan kamu ada waktu?",["有空，你想去哪儿？","yǒu kōng, nǐ xiǎng qù nǎr?","Ada, kamu mau ke mana?"],[["我吃了药。","wǒ chī le yào."],["房租很贵。","fángzū hěn guì."],["它很重。","tā hěn zhòng."]]],["您想喝点什么？","nín xiǎng hē diǎn shénme?","Anda mau minum apa?",["一杯热茶，少放糖。","yì bēi rèchá, shǎo fàng táng.","Satu teh panas, gulanya sedikit."],[["我在公司。","wǒ zài gōngsī."],["在学校旁边。","zài xuéxiào pángbiān."],["已经寄了。","yǐjīng jì le."]]],["你的手机找到了吗？","nǐ de shǒujī zhǎo dào le ma?","HP-mu sudah ketemu?",["找到了，太好了！","zhǎo dào le, tài hǎo le!","Sudah ketemu, syukurlah!"],[["我吃火锅。","wǒ chī huǒguō."],["很便宜。","hěn piányi."],["六点半。","liù diǎn bàn."]]],["要不要我帮你打印文件？","yào búyào wǒ bāng nǐ dǎyìn wénjiàn?","Mau saya bantu cetak dokumen?",["好的，麻烦你了。","hǎo de, máfan nǐ le.","Boleh, merepotkan kamu ya."],[["我的头很疼。","wǒ de tóu hěn téng."],["去年九月。","qùnián jiǔ yuè."],["它很贵。","tā hěn guì."]]]],"st":[{"n":1,"c":[1],"ti":"Pagi hari Ami","tz":"阿明的早上","z":[["我叫阿明。","wǒ jiào Āmíng.","Namaku Ami."],["我一般六点半起床。","wǒ yìbān liù diǎn bàn qǐchuáng.","Aku biasanya bangun jam setengah tujuh."],["起床以后，我先洗澡，然后吃早饭。","qǐchuáng yǐhòu, wǒ xiān xǐzǎo, ránhòu chī zǎofàn.","Setelah bangun, aku mandi dulu, lalu sarapan."],["今天我吃了一碗炒饭，喝了一杯热茶。","jīntiān wǒ chī le yì wǎn chǎofàn, hē le yì bēi rèchá.","Hari ini aku makan semangkuk nasi goreng dan minum segelas teh panas."],["七点半我骑摩托车去公司。","qī diǎn bàn wǒ qí mótuōchē qù gōngsī.","Jam setengah delapan aku naik motor ke kantor."],["路上堵车了，我八点十分才到。","lùshàng dǔchē le, wǒ bā diǎn shí fēn cái dào.","Di jalan macet, aku baru sampai jam delapan lewat sepuluh."],["经理说：“没关系，下次早点出门。”","jīnglǐ shuō: méi guānxi, xià cì zǎo diǎn chūmén.","Manajer berkata: “Tidak apa-apa, lain kali berangkat lebih awal.”"]],"q":[["Ami biasanya bangun jam berapa?",["Jam enam","Jam setengah tujuh","Jam tujuh","Jam setengah delapan"],1],["Apa yang Ami makan dan minum pagi ini?",["Mi dan kopi","Roti dan susu","Nasi goreng dan teh panas","Bubur dan air putih"],2],["Mengapa Ami baru sampai jam 08.10?",["Bangun kesiangan","Di jalan macet","Motornya rusak","Lupa membawa tas"],1]]},{"n":2,"c":[2],"ti":"Makan di restoran","tz":"在餐厅","z":[["今天是周末，我和朋友去一家餐厅吃饭。","jīntiān shì zhōumò, wǒ hé péngyou qù yì jiā cāntīng chī fàn.","Hari ini akhir pekan, aku dan temanku makan di sebuah restoran."],["老板问我们：“几位？”我说：“两位。”","lǎobǎn wèn wǒmen: jǐ wèi? wǒ shuō: liǎng wèi.","Pemilik bertanya: “Berapa orang?” Aku jawab: “Dua orang.”"],["我们点了一份炒饭、一份鸡肉和两杯冰茶。","wǒmen diǎn le yí fèn chǎofàn, yí fèn jīròu hé liǎng bēi bīngchá.","Kami memesan satu porsi nasi goreng, satu porsi ayam, dan dua gelas teh es."],["朋友不太能吃辣，所以我们对老板说：“请少放辣。”","péngyou bú tài néng chī là, suǒyǐ wǒmen duì lǎobǎn shuō: qǐng shǎo fàng là.","Temanku tidak terlalu kuat pedas, jadi kami bilang ke pemilik: “Tolong sedikit saja pedasnya.”"],["一共二十八万印尼盾。","yígòng èr shí bā wàn yìnnídùn.","Totalnya 280.000 rupiah."],["我们用二维码付款，很方便。","wǒmen yòng èrwéimǎ fù kuǎn, hěn fāngbiàn.","Kami bayar pakai kode QR, praktis sekali."]],"q":[["Berapa orang yang makan?",["Satu","Dua","Tiga","Empat"],1],["Mengapa mereka minta pedasnya dikurangi?",["Makanannya sudah dingin","Temannya tidak terlalu kuat pedas","Mereka buru-buru","Pemiliknya lupa"],1],["Bagaimana cara mereka membayar?",["Tunai","Transfer","Kode QR","Kartu kredit"],2]]},{"n":3,"c":[3],"ti":"Berangkat ke bandara","tz":"去机场","z":[["今天我要坐飞机去雅加达。","jīntiān wǒ yào zuò fēijī qù Yǎjiādá.","Hari ini aku akan naik pesawat ke Jakarta."],["飞机是上午十一点的，所以我八点就出门了。","fēijī shì shàngwǔ shí yī diǎn de, suǒyǐ wǒ bā diǎn jiù chūmén le.","Pesawatnya jam sebelas pagi, jadi aku sudah berangkat jam delapan."],["我先坐地铁，再打车去机场。","wǒ xiān zuò dìtiě, zài dǎchē qù jīchǎng.","Aku naik MRT dulu, lalu naik taksi online ke bandara."],["路上有一点堵车，但是我们九点五十就到了。","lùshàng yǒu yì diǎn dǔchē, dànshì wǒmen jiǔ diǎn wǔ shí jiù dào le.","Di jalan agak macet, tapi kami sudah sampai jam sembilan lewat lima puluh."],["我很高兴，因为还有时间吃早饭。","wǒ hěn gāoxìng, yīnwèi hái yǒu shíjiān chī zǎofàn.","Aku senang, karena masih ada waktu untuk sarapan."]],"q":[["Pesawat berangkat jam berapa?",["Jam delapan","Jam sembilan","Jam sepuluh","Jam sebelas"],3],["Bagaimana cara tokoh pergi ke bandara?",["Hanya naik MRT","MRT dulu, lalu taksi online","Naik motor sendiri","Jalan kaki"],1],["Mengapa tokoh senang?",["Tiketnya murah","Tidak ada macet sama sekali","Masih sempat sarapan","Bandaranya dekat"],2]]},{"n":4,"c":[9],"ti":"Ke dokter","tz":"看医生","z":[["我昨天有点发烧，头也很疼，还咳嗽。","wǒ zuótiān yǒu diǎn fāshāo, tóu yě hěn téng, hái késou.","Kemarin aku agak demam, kepala juga sakit, dan batuk."],["今天我去医院看医生。","jīntiān wǒ qù yīyuàn kàn yīshēng.","Hari ini aku pergi ke rumah sakit menemui dokter."],["医生说我感冒了，要多喝水，多休息，少吃辣的。","yīshēng shuō wǒ gǎnmào le, yào duō hē shuǐ, duō xiūxi, shǎo chī là de.","Dokter bilang aku flu, harus banyak minum air, banyak istirahat, dan kurangi makanan pedas."],["这个药一天吃三次，饭后吃，每次一片。","zhège yào yì tiān chī sān cì, fàn hòu chī, měi cì yí piàn.","Obat ini diminum tiga kali sehari, setelah makan, tiap kali satu tablet."],["我回家吃了药，早点睡觉了。","wǒ huí jiā chī le yào, zǎo diǎn shuìjiào le.","Aku pulang, minum obat, lalu tidur lebih awal."]],"q":[["Apa kata dokter tentang sakit tokoh?",["Demam berdarah","Flu","Maag","Alergi"],1],["Bagaimana aturan minum obatnya?",["Sehari sekali sebelum makan","Tiga kali sehari, setelah makan, satu tablet","Dua kali sehari, dua tablet","Hanya saat batuk"],1],["Apa yang harus dikurangi tokoh?",["Air putih","Istirahat","Makanan pedas","Olahraga"],2]]},{"n":5,"c":[12],"ti":"Mencari kamar sewa","tz":"租房子","z":[["我想在学校附近租一个房间。","wǒ xiǎng zài xuéxiào fùjìn zū yí gè fángjiān.","Aku ingin menyewa kamar di dekat sekolah."],["房东带我看了一个房间。","fángdōng dài wǒ kàn le yí gè fángjiān.","Pemilik membawaku melihat sebuah kamar."],["房间比较大，也很干净，有空调。","fángjiān bǐjiào dà, yě hěn gānjìng, yǒu kōngtiáo.","Kamarnya lumayan besar, bersih juga, dan ada AC."],["房租一个月一百二十万印尼盾，包括水电费。","fángzū yí gè yuè yì bǎi èr shí wàn yìnnídùn, bāokuò shuǐdiànfèi.","Sewanya 1.200.000 rupiah sebulan, sudah termasuk air dan listrik."],["房东说押金是一个月房租。","fángdōng shuō yājīn shì yí gè yuè fángzū.","Pemilik bilang uang jaminannya sebesar sewa satu bulan."],["我觉得很合适，所以今天签合同，明天搬进来。","wǒ juéde hěn héshì, suǒyǐ jīntiān qiān hétóng, míngtiān bān jìnlai.","Menurutku cocok, jadi hari ini tanda tangan kontrak, besok pindah."]],"q":[["Di mana tokoh ingin menyewa kamar?",["Dekat kantor","Dekat sekolah","Dekat bandara","Dekat pasar"],1],["Apa yang termasuk dalam uang sewa?",["Air dan listrik","Makan","Motor","Internet saja"],0],["Berapa uang jaminannya?",["Sewa satu bulan","Sewa dua bulan","Satu juta rupiah","Tidak ada"],0]]},{"n":6,"c":[13],"ti":"Mengirim paket","tz":"寄包裹","z":[["妈妈的生日快到了，我想给她寄一个包裹。","māma de shēngrì kuài dào le, wǒ xiǎng gěi tā jì yí gè bāoguǒ.","Ulang tahun ibu sudah dekat, aku ingin mengirimkan paket."],["我去邮局，先拿号码，然后排队。","wǒ qù yóujú, xiān ná hàomǎ, ránhòu páiduì.","Aku pergi ke kantor pos, ambil nomor dulu, lalu antre."],["邮局的人给我一张表格，让我写清楚地址和电话号码。","yóujú de rén gěi wǒ yì zhāng biǎogé, ràng wǒ xiě qīngchu dìzhǐ hé diànhuà hàomǎ.","Petugas pos memberiku selembar formulir dan menyuruhku menulis jelas alamat dan nomor telepon."],["包裹不重，寄到雅加达大概三天能到，一共十五万。","bāoguǒ bú zhòng, jì dào Yǎjiādá dàgài sān tiān néng dào, yígòng shí wǔ wàn.","Paketnya tidak berat, ke Jakarta kira-kira tiga hari sampai, totalnya 150.000."],["我付了现金，还拿到了收据。","wǒ fù le xiànjīn, hái ná dào le shōujù.","Aku bayar tunai dan juga menerima struk."]],"q":[["Mengapa tokoh mengirim paket?",["Untuk teman kantor","Ulang tahun ibu sudah dekat","Menjual barang","Mengembalikan barang"],1],["Apa yang dilakukan tokoh pertama kali di kantor pos?",["Mengisi formulir","Membayar","Mengambil nomor","Menimbang paket"],2],["Berapa lama paket sampai di Jakarta?",["Sehari","Tiga hari","Seminggu","Sebulan"],1]]},{"n":7,"c":[6],"ti":"Rencana akhir pekan","tz":"周末的计划","z":[["这个周末天气很好，我打算和朋友去打羽毛球。","zhège zhōumò tiānqì hěn hǎo, wǒ dǎsuan hé péngyou qù dǎ yǔmáoqiú.","Akhir pekan ini cuacanya bagus, aku berencana main bulu tangkis dengan teman."],["我们约好下午四点在学校旁边的球场见面。","wǒmen yuē hǎo xiàwǔ sì diǎn zài xuéxiào pángbiān de qiúchǎng jiànmiàn.","Kami janjian bertemu jam empat sore di lapangan samping sekolah."],["我带水，朋友带球。","wǒ dài shuǐ, péngyou dài qiú.","Aku bawa air, temanku bawa kok."],["打完球以后，我们一起去吃火锅。","dǎ wán qiú yǐhòu, wǒmen yìqǐ qù chī huǒguō.","Selesai main, kami makan hot pot bersama."],["我觉得周末一边运动一边聊天，特别开心。","wǒ juéde zhōumò yìbiān yùndòng yìbiān liáotiān, tèbié kāixīn.","Menurutku akhir pekan olahraga sambil mengobrol itu sangat menyenangkan."]],"q":[["Jam berapa mereka janjian bertemu?",["Jam dua","Jam tiga","Jam empat","Jam lima"],2],["Siapa membawa apa?",["Tokoh bawa air, teman bawa kok","Tokoh bawa kok, teman bawa air","Keduanya bawa air","Keduanya bawa kok"],0],["Apa yang mereka lakukan setelah bermain?",["Pulang","Makan hot pot","Belajar","Menonton film"],1]]},{"n":8,"c":[19],"ti":"HP yang hilang","tz":"手机丢了","z":[["昨天下午我在地铁站把手机丢了，我很着急。","zuótiān xiàwǔ wǒ zài dìtiě zhàn bǎ shǒujī diū le, wǒ hěn zháojí.","Kemarin sore aku kehilangan HP di stasiun MRT, aku sangat panik."],["我马上去找地铁站的人，请他帮我找。","wǒ mǎshàng qù zhǎo dìtiě zhàn de rén, qǐng tā bāng wǒ zhǎo.","Aku segera menemui petugas stasiun dan memintanya membantu mencari."],["他让我写清楚手机的颜色和号码。","tā ràng wǒ xiě qīngchu shǒujī de yánsè hé hàomǎ.","Dia menyuruhku menulis jelas warna dan nomor HP-nya."],["今天早上他打电话告诉我：“手机找到了。”","jīntiān zǎoshang tā dǎdiànhuà gàosù wǒ: shǒujī zhǎo dào le.","Pagi ini dia menelepon: “HP-nya sudah ketemu.”"],["我非常高兴，对他说了很多次谢谢。","wǒ fēicháng gāoxìng, duì tā shuō le hěn duō cì xièxie.","Aku sangat senang dan berkali-kali bilang terima kasih."]],"q":[["Di mana tokoh kehilangan HP?",["Di kantor","Di stasiun MRT","Di restoran","Di rumah"],1],["Apa yang diminta untuk ditulis?",["Nama dan alamat","Warna dan nomor HP","Harga HP","Nomor KTP"],1],["Bagaimana akhir ceritanya?",["HP tidak ketemu","HP ketemu","HP diganti baru","HP rusak"],1]]}],"vn":[{"c":[],"t":"Perkenalan diri","sc":"Kamu bertemu teman baru di kelas. Sebutkan nama, pekerjaan/kegiatan, tempat tinggal, dan satu hobi.","tp":"Pola: 我叫…… / 我在……工作 / 我住在…… / 我喜欢……","z":"大家好，我叫阿明。我在公司工作，我住在学校附近。我喜欢打羽毛球。","py":"dàjiā hǎo, wǒ jiào Āmíng. wǒ zài gōngsī gōngzuò, wǒ zhù zài xuéxiào fùjìn. wǒ xǐhuan dǎ yǔmáoqiú.","i":"Halo semuanya, namaku Ami. Aku bekerja di kantor, tinggal dekat sekolah. Aku suka bulu tangkis."},{"c":[1],"t":"Pagi hari kamu","sc":"Ceritakan urutan kegiatanmu dari bangun sampai berangkat.","tp":"Pola: 一般 / 先……再…… / 就 / 才","z":"我一般六点起床，先洗澡，再吃早饭。七点半我就出门了。","py":"wǒ yìbān liù diǎn qǐchuáng, xiān xǐzǎo, zài chī zǎofàn. qī diǎn bàn wǒ jiù chūmén le.","i":"Aku biasanya bangun jam enam, mandi dulu lalu sarapan. Jam setengah delapan aku sudah berangkat."},{"c":[2],"t":"Pesan di warung","sc":"Kamu memesan makanan dan minuman di warung dan minta dibungkus.","tp":"Pola: 一份 / 一碗 / 一杯 / 少放…… / 打包","z":"老板，我要一份炒饭和一杯冰茶，少放糖，打包。","py":"lǎobǎn, wǒ yào yí fèn chǎofàn hé yì bēi bīngchá, shǎo fàng táng, dǎbāo.","i":"Pak/Bu, saya mau satu porsi nasi goreng dan segelas teh es, gulanya sedikit, bungkus."},{"c":[2],"t":"Minta rekomendasi","sc":"Kamu tidak kuat pedas dan bertanya menu yang direkomendasikan.","tp":"Pola: 请问有什么推荐的？/ 不太能吃辣","z":"请问有什么推荐的？我不太能吃辣。","py":"qǐngwèn yǒu shénme tuījiàn de? wǒ bú tài néng chī là.","i":"Permisi, ada rekomendasi? Saya tidak terlalu kuat pedas."},{"c":[2,4],"t":"Tanya total & bayar","sc":"Kamu menanyakan total harga dan memilih cara bayar.","tp":"Pola: 一共多少钱？/ 可以……吗？/ 扫码","z":"一共多少钱？我可以扫码付款吗？","py":"yígòng duōshǎo qián? wǒ kěyǐ sǎomǎ fù kuǎn ma?","i":"Totalnya berapa? Boleh saya b function lsSameQ(x,showPy){const o=shuf([x,...shuf(S.filter(y=>y!==x&&y.z!==x.z)).slice(0,3)]);
  return{tag:'Mendengar',say:x.z,sub:'Kalimat mana yang kamu dengar?',one:1,o:o.map(y=>({t:y.z,s:showPy?pyOf(y):'',cls:'hz'})),ok:o.indexOf(x),fb:`${x.z} · ${x.i}`,rev:`${x.z} · ${pyOf(x)} · ${x.i}`}}
function storyQs(st,noSay){const say=st.z.map(x=>x[0]).join('');return st.q.map(([q,opts,ok],k)=>{const o=opts.map((t,i)=>({t,i}));const sh=shuf(o);
  const Q={tag:'Cerita',sub:q,one:1,o:sh.map(x=>({t:x.t})),ok:sh.findIndex(x=>x.i===ok),fb:`Jawaban: ${opts[ok]}`,rev:`${q} → ${opts[ok]}`};
  if(!noSay){Q.say=say;Q.story=st.n;Q.sub=`Dengarkan ceritanya. ${q}`;if(k>0)Q.noauto=true}return Q})}
function sentQ(x){const want=x.t.map(t=>t[0]).join('');const seen=new Set([want]),wr=[];let g=0;
  while(wr.length<3&&g++<60){const p=shuf(x.t).map(t=>t[0]).join('');if(!seen.has(p)){seen.add(p);wr.push(p)}}
  const o=shuf([want,...wr]);const tk=shuf(x.t).map(t=>t[0]).join('  /  ');
  return{tag:'Susun kalimat',sub:`Susun kata ini menjadi kalimat yang benar: ${tk}`,one:1,o:o.map(t=>({t,cls:'hz'})),ok:o.indexOf(want),fb:`${x.z} · ${pyOf(x)} · ${x.i}`,rev:`${x.z} · ${pyOf(x)} · ${x.i}`}}
/* ---- Gambar ---- */
function pic(){
  const showPy=$('#showpy').checked,qs=[];
  fresh(PIC,'pic',6).forEach((x,i)=>qs.push(picQ(x,i<4?'z':'p',showPy)));
  fresh(SC,'sc',4).forEach(x=>qs.push(scQ(x,showPy)));
  runSet('Tebak gambar',shuf(qs))}
/* ---- Dengar ---- */
function listen(){
  const showPy=$('#showpy').checked,P=pool(S).length>=4?pool(S):S,qs=[];
  fresh(P,'ls-a',4).forEach(x=>qs.push(lsArtiQ(x)));
  fresh(LR,'lr',4).forEach(r=>qs.push(lsLRQ(r,showPy)));
  fresh(P,'ls-p',2).forEach(x=>qs.push(lsSameQ(x,showPy)));
  runSet('Latihan mendengar',shuf(qs))}
/* ---- Ruang Campur: semua jenis soal dalam satu ronde ---- */
function room(){
  const showPy=$('#showpy').checked,types=['arti','hanzi','pinyin'],qs=[];
  fresh(V,'room-v',3).forEach((w,k)=>{const ty=types[k%3];
    const others=shuf(V.filter(x=>x!==w&&(ty==='pinyin'?x.p!==w.p:ty==='arti'?x.i!==w.i:x.h!==w.h))).slice(0,3),o=shuf([w,...others]);
    const base={tag:'Kuis kata',ok:o.indexOf(w),fb:`${w.h} · ${w.p} · ${w.i}`,rev:`${w.h} · ${w.p} · ${w.i}`};
    if(ty==='hanzi')qs.push({...base,sub:'Pilih hanzi untuk arti ini: '+w.i,o:o.map(y=>({t:y.h,s:showPy?y.p:'',cls:'han2'}))});
    else qs.push({...base,han:w.h,sub:ty==='pinyin'?'Pilih pinyin yang tepat':(showPy?w.p+' · pilih arti yang tepat':'Pilih arti yang tepat'),o:o.map(y=>({t:ty==='pinyin'?y.p:y.i}))})});
  fresh(PIC,'room-p',3).forEach((x,i)=>qs.push(picQ(x,i<2?'z':'p',showPy)));
  fresh(SC,'room-sc',2).forEach(x=>qs.push(scQ(x,showPy)));
  fresh(S,'room-la',2).forEach(x=>qs.push(lsArtiQ(x)));
  fresh(LR,'room-lr',3).forEach(r=>qs.push(lsLRQ(r,showPy)));
  fresh(S,'room-ls',2).forEach(x=>qs.push(lsSameQ(x,showPy)));
  fresh(S,'room-s',2).forEach(x=>qs.push(sentQ(x)));
  const list=shuf(qs),block=storyQs(fresh(ST,'room-st',1)[0]);
  list.splice(Math.floor(Math.random()*(list.length+1)),0,...block);
  runSet('Ruang Campur',list,{after:g=>{const b=el('button','btn alt','Lanjut latihan bicara (Voice Note)');b.addEventListener('click',()=>document.querySelector('[data-m="voice"]').click());g.append(b)}})}
/* ---- Cerita ---- */
function story(){
  const cand=sel.value==='all'?ST:ST.filter(s=>s.c.includes(+sel.value));const st=fresh(cand.length?cand:ST,'story',1)[0];
  let py=$('#showpy').checked,tr=false,hide=false;
  game.append(el('h2','',`Cerita: ${st.ti}`),el('div','sub',st.tz));
  const tools=el('div','row'),b1=el('button','btn','Dengar cerita'),b2=el('button','btn alt','Pelan'),b3=el('button','btn alt','Berhenti');
  const play=slow=>playSrc('audio/cerita-'+VOICE()+'-'+st.n+'.mp3',st.z.map(x=>x[0]).join(''),slow);b1.addEventListener('click',()=>play());b2.addEventListener('click',()=>play(true));b3.addEventListener('click',stopAudio);tools.append(b1,b2,b3);
  const opts=el('div','opts');
  const mkc=(txt,init,fn)=>{const l=el('label','chk');const c=document.createElement('input');c.type='checkbox';c.checked=init;c.addEventListener('change',()=>{fn(c.checked);draw()});l.append(c,' '+txt);return l};
  opts.append(mkc('Pinyin',py,v=>py=v),mkc('Terjemahan',tr,v=>tr=v),mkc('Sembunyikan teks (latihan dengar)',hide,v=>hide=v));
  const body=el('div','story');
  function draw(){body.innerHTML='';if(hide){body.append(el('div','hint','Teks disembunyikan. Tekan “Dengar cerita”, lalu mulai soal.'));return}
    st.z.forEach(([z,p,i])=>{const d=el('p');d.append(el('span','z',z));if(py)d.append(el('span','p',p));if(tr)d.append(el('span','i',i));body.append(d)})}
  draw();
  const go=el('button','btn','Mulai soal (3)'),nx=el('button','btn alt','Cerita lain');
  go.addEventListener('click',()=>{stopAudio();const qs=storyQs(st,true);
    runSet(`Cerita: ${st.ti}`,qs,{base:15,ctx:()=>{const d=document.createElement('details');d.className='how';const s=el('summary','','Baca cerita lagi');d.append(s);const b=el('div','story');st.z.forEach(([z,p,i])=>{const q=el('p');q.append(el('span','z',z));q.append(el('span','p',p));q.append(el('span','i',i));b.append(q)});d.append(b);return d}})});
  nx.addEventListener('click',()=>{stopAudio();start()});
  const r=el('div','row');r.append(go,nx);game.append(tools,opts,body,r)}
/* ---- Tema ---- */
(function(){const b=$('#themebtn'),L={auto:'Tema: otomatis',light:'Tema: terang',dark:'Tema: gelap'};let m='auto';try{m=localStorage.getItem('himawari-theme')||'auto'}catch(e){}
  const ap=()=>{if(m==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',m);b.textContent=L[m]};
  b.addEventListener('click',()=>{m=m==='auto'?'light':m==='light'?'dark':'auto';try{localStorage.setItem('himawari-theme',m)}catch(e){}ap()});ap()})();
start();
</script>
</body>
